<section class="card narrow-card">
  <header class="card-head"><h1>Settings</h1></header>
  <div class="form-grid">
    <label for="owner-name">Your name</label>
    <div>
      <input id="owner-name" data-testid="owner-name" autocomplete="name" [value]="ownerName()"
             (input)="onNameInput($any($event.target).value)" (blur)="save()" placeholder="e.g. Max Mustermann" />
      <p class="hint">Shown as your side of every Game.
        @if (status()) { <span class="status" data-testid="settings-status">{{ status() }}</span> }
      </p>
    </div>

    <label for="alias-input">Aliases</label>
    <div>
      <div class="tags">
        @for (alias of aliases(); track alias) {
          <span class="tag" data-testid="alias">{{ alias }}
            <button type="button" class="tag-remove" [attr.aria-label]="'Remove alias ' + alias" (click)="removeAlias(alias)">×</button>
          </span>
        }
        <input #aliasInput id="alias-input" data-testid="alias-input" placeholder="Add another spelling"
               (keydown.enter)="addAlias(aliasInput)" (blur)="addAlias(aliasInput)" />
      </div>
      <p class="hint">Other spellings of your name in PGN files, such as a nickname. "Mustermann, Max", "Mustermann M." and
        "Max Mustermann" are recognised without an Alias.</p>
    </div>
  </div>
</section>
